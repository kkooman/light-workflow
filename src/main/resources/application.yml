spring:
  application:
    name: light-workflow
  jackson:
    time-zone: Asia/Seoul
  mvc:
    time-zone: Asia/Seoul
  datasource:
    customer:
      url: ${CUSTOMER_DB_URL:jdbc:h2:mem:customerdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
      driver-class-name: ${CUSTOMER_DB_DRIVER:org.h2.Driver}
      username: ${CUSTOMER_DB_USERNAME:sa}
      password: ${CUSTOMER_DB_PASSWORD:}
      hikari:
        connection-init-sql: SET TIME ZONE 'UTC'
    watchlist:
      url: ${WATCHLIST_DB_URL:jdbc:h2:mem:watchlistdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
      driver-class-name: ${WATCHLIST_DB_DRIVER:org.h2.Driver}
      username: ${WATCHLIST_DB_USERNAME:sa}
      password: ${WATCHLIST_DB_PASSWORD:}
      hikari:
        connection-init-sql: SET TIME ZONE 'UTC'
  h2:
    console:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

mybatis:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.kkooman.lightworkflow
  configuration:
    map-underscore-to-camel-case: true

watchlist:
  search:
    index-path: ${WATCHLIST_INDEX_PATH:./data/lucene/watchlist}
    high-risk-threshold: 90
    review-threshold: 70
    field-weights:
      korean-name: 30
      english-name: 25
      date-of-birth: 15
      country: 8
      residence: 8
      aka: 8
      gender: 3
      listing-reason: 3

lightworkflow:
  maintenance:
    file-path: ${MAINTENANCE_FILE_PATH:/tmp/lightworkflow-maintenance.marker}

server:
  port: 8080
