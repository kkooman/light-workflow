<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="refresh" content="30" />
    <title>서비스 점검 중</title>
    <style>
      body {
        margin: 0;
        display: grid;
        place-items: center;
        min-height: 100vh;
        background: #111827;
        color: #f9fafb;
        font-family: Arial, sans-serif;
      }
      .box {
        text-align: center;
        padding: 2rem 3rem;
        border: 1px solid #374151;
        border-radius: 12px;
        background: rgba(17, 24, 39, 0.9);
      }
      h1 { margin-bottom: 0.5rem; }
      p { margin: 0; color: #d1d5db; }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>서비스 점검 중입니다.</h1>
      <p>배포가 진행 중이니 잠시만 기다려 주세요.</p>
    </div>
  </body>
</html>
